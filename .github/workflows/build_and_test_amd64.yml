name: Build and test on amd64

on:
  workflow_dispatch:
    inputs:
      debug:
        required: true
        type: boolean
        description: Debug build
        default: true
      branch:
        required: true
        type: string
        description: Branch to build

  workflow_call:
    inputs:
      debug:
        required: true
        type: boolean
        default: true
      branch:
        required: true
        type: string

jobs:
  build:
    runs-on: [ora, X64]

    env:
      PACKAGES: "libspdlog-dev libgmock-dev protobuf-compiler"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Install additional packages
        run: sudo apt install --yes $PACKAGES

      - name: Compile
        run: |
          debug=${{ inputs.debug && 'DEBUG=1' || '' }} &&
          make -j $(nproc) $debug CXX=clang++

      - name: Run unit tests
        run: |
          debug=${{ inputs.debug && 'DEBUG=1' || '' }} &&
          make test -j $(nproc) $debug CXX=clang++
