
name: Run code analysis

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
        description: Branch to analyze

jobs:
  code_analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cpp

    env:
      SONAR_SERVER_URL: "https://sonarcloud.io"
      SONAR_PROJECT_KEY: "uweseimet_scsi2pi"
      SONAR_ORGANIZATION: "uweseimet-org"
      SONAR_SCANNER_VERSION: 8.1.0.6389
      APT_PACKAGES: protobuf-compiler libspdlog-dev libgmock-dev bear

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Set up sonar-scanner
        run: |
          mkdir -p $HOME/.sonar
          curl -fsSLo /tmp/scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          unzip -o /tmp/scanner.zip -d $HOME/.sonar/

      - name: Compile with coverage data
        run: bear -- make -j $(nproc) DEBUG=1 coverage

      - name: Run gcov
        run: gcov -p $(find ../build/obj -name '*.gcno')

      - name: Run sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64/bin/sonar-scanner \
            --define sonar.host.url=$SONAR_SERVER_URL \
            --define sonar.projectKey=$SONAR_PROJECT_KEY \
            --define sonar.organization=$SONAR_ORGANIZATION \
            --define sonar.sourceEncoding=UTF-8 \
            --define sonar.cfamily.compile-commands=compile_commands.json \
            --define sonar.cfamily.gcov.reportsPath=. \
            --define sonar.c.file.suffixes= \
            --define sonar.cpp.file.suffixes=.cpp,.h \
            --define sonar.branch.name=${{ inputs.branch }} \
            --define sonar.cpd.exclusions="s2pdump/sg_executor.h" \
            --define sonar.test.inclusions=test/**
