name: Build and test on aarch64

on:
  workflow_dispatch:
    inputs:
      debug:
        required: true
        type: boolean
        description: Debug build
        default: true
      branch:
        required: true
        type: string
        description: Branch to build

  workflow_call:
    inputs:
      debug:
        required: false
        type: boolean
        default: true
      branch:
        required: false
        type: string

jobs:
  build:
    runs-on: [ora, ARM64]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Compile
        run: |
          debug=${{ inputs.debug && 'DEBUG=1' || '' }} &&
          make -j $(nproc) $debug CXX=clang++

      - name: Run unit tests
        run: |
          debug=${{ inputs.debug && 'DEBUG=1' || '' }} &&
          make test -j $(nproc) $debug CXX=clang++
